[package]
name = "pc_manager"
version = "0.0.1"
description = "PC Manager - Software de Escritorio Core-Modular para Windows (Rust + Tauri)"
authors = ["aavila"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pc_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
